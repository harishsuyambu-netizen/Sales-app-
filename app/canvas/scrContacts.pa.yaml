Screens:
  scrContacts:
    Properties:
      Fill: =cCanvas
      OnVisible: =Set(varNavKey, 4)
    Children:
      - conContactsRoot:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =cCanvas
            Height: =Parent.Height
            Width: =Parent.Width
          Children:
            - shpContactsAccent:
                Control: Image
                Properties:
                  Height: =5
                  Image: =cAccentSvg
                  ImagePosition: =ImagePosition.Stretch
                  Width: =Parent.Width
            - shpContactsRail:
                Control: Rectangle
                Properties:
                  Fill: =cNavy
                  Height: =Parent.Height - 5
                  Visible: =App.Width >= 900
                  Width: =If(App.Width < 900, 0, 98)
                  Y: =5
            - shpContactsMobileNav:
                Control: Rectangle
                Properties:
                  Fill: =cNavy
                  Height: =56
                  Visible: =App.Width < 900
                  Width: =Parent.Width
                  Y: =5
            - imgContactsLogo:
                Control: Image
                Properties:
                  AccessibleLabel: ="CRM logo"
                  Height: =54
                  Image: =cLogoSvg
                  ImagePosition: =ImagePosition.Fit
                  Width: =54
                  X: =If(App.Width < 900, 12, 20)
                  Y: =If(App.Width < 900, 12, 22)
            - galContactsMobileNav:
                Control: Gallery
                Variant: Horizontal
                Properties:
                  AccessibleLabel: ="Main navigation"
                  Height: =46
                  Items: =Table({Key:1, Caption:"Dashboard"}, {Key:2, Caption:"Leads"}, {Key:3, Caption:"Pipeline"}, {Key:4, Caption:"Contacts"}, {Key:5, Caption:"Activities"})
                  Selectable: =false
                  ShowScrollbar: =false
                  TabIndex: =0
                  TemplatePadding: =2
                  TemplateSize: =84
                  Visible: =App.Width < 900
                  Width: =Parent.Width - 70
                  X: =66
                  Y: =10
                Children:
                  - btnContactsMobileNavItem:
                      Control: Classic/Button
                      Properties:
                        BorderThickness: =0
                        Color: =If(varNavKey = ThisItem.Key, cBlue, cWhite)
                        Fill: =If(varNavKey = ThisItem.Key, cWhite, cNavy)
                        Font: =cFont
                        OnSelect: =Set(varNavKey, ThisItem.Key); Switch(ThisItem.Key, 1, Navigate(Screen1, ScreenTransition.None), 2, Navigate(scrLeads, ScreenTransition.None), 3, Navigate(scrPipeline, ScreenTransition.None), 4, Navigate(scrContacts, ScreenTransition.None), 5, Navigate(scrActivities, ScreenTransition.None))
                        RadiusBottomLeft: =14
                        RadiusBottomRight: =14
                        RadiusTopLeft: =14
                        RadiusTopRight: =14
                        Size: =10
                        Text: =ThisItem.Caption
                        Width: =Parent.TemplateWidth - 4
                        Y: =2
            - btnContactsNavDash:
                Control: Classic/Button
                Properties:
                  BorderThickness: =0
                  Color: =cWhite
                  Fill: =cNavy
                  Font: =cFont
                  Height: =If(App.Width < 900, 42, 56)
                  OnSelect: =Navigate(Screen1, ScreenTransition.None)
                  RadiusBottomLeft: =14
                  RadiusBottomRight: =14
                  RadiusTopLeft: =14
                  RadiusTopRight: =14
                  Size: =If(App.Width < 900, 10, 11)
                  Text: =If(App.Width < 900, "Dashboard", "▥" & Char(10) & "Dashboard")
                  Visible: =App.Width >= 900
                  Width: =If(App.Width < 900, 80, 82)
                  X: =If(App.Width < 900, 12, 8)
                  Y: =If(App.Width < 900, 12, 92)
            - btnContactsNavLeads:
                Control: Classic/Button
                Properties:
                  BorderThickness: =0
                  Color: =cWhite
                  Fill: =cNavy
                  Font: =cFont
                  Height: =If(App.Width < 900, 42, 56)
                  OnSelect: =Navigate(scrLeads, ScreenTransition.None)
                  RadiusBottomLeft: =14
                  RadiusBottomRight: =14
                  RadiusTopLeft: =14
                  RadiusTopRight: =14
                  Size: =If(App.Width < 900, 10, 11)
                  Text: =If(App.Width < 900, "Leads", "◎" & Char(10) & "Leads")
                  Visible: =App.Width >= 900
                  Width: =If(App.Width < 900, 70, 82)
                  X: =If(App.Width < 900, 96, 8)
                  Y: =If(App.Width < 900, 12, 154)
            - btnContactsNavPipe:
                Control: Classic/Button
                Properties:
                  BorderThickness: =0
                  Color: =cWhite
                  Fill: =cNavy
                  Font: =cFont
                  Height: =If(App.Width < 900, 42, 56)
                  OnSelect: =Navigate(scrPipeline, ScreenTransition.None)
                  RadiusBottomLeft: =14
                  RadiusBottomRight: =14
                  RadiusTopLeft: =14
                  RadiusTopRight: =14
                  Size: =If(App.Width < 900, 10, 11)
                  Text: =If(App.Width < 900, "Pipeline", "▥" & Char(10) & "Pipeline")
                  Visible: =App.Width >= 900
                  Width: =If(App.Width < 900, 76, 82)
                  X: =If(App.Width < 900, 170, 8)
                  Y: =If(App.Width < 900, 12, 216)
            - btnContactsNavContacts:
                Control: Classic/Button
                Properties:
                  BorderThickness: =0
                  Color: =cBlue
                  Fill: =cWhite
                  Font: =cFont
                  Height: =If(App.Width < 900, 42, 56)
                  OnSelect: =Navigate(scrContacts, ScreenTransition.None)
                  RadiusBottomLeft: =14
                  RadiusBottomRight: =14
                  RadiusTopLeft: =14
                  RadiusTopRight: =14
                  Size: =If(App.Width < 900, 10, 11)
                  Text: =If(App.Width < 900, "Contacts", "♙" & Char(10) & "Contacts")
                  Visible: =App.Width >= 900
                  Width: =If(App.Width < 900, 76, 82)
                  X: =If(App.Width < 900, 250, 8)
                  Y: =If(App.Width < 900, 12, 278)
            - btnContactsNavActivities:
                Control: Classic/Button
                Properties:
                  BorderThickness: =0
                  Color: =cWhite
                  Fill: =cNavy
                  Font: =cFont
                  Height: =If(App.Width < 900, 42, 56)
                  OnSelect: =Navigate(scrActivities, ScreenTransition.None)
                  RadiusBottomLeft: =14
                  RadiusBottomRight: =14
                  RadiusTopLeft: =14
                  RadiusTopRight: =14
                  Size: =If(App.Width < 900, 10, 11)
                  Text: =If(App.Width < 900, "Activities", "▣" & Char(10) & "Activities")
                  Visible: =App.Width >= 900
                  Width: =If(App.Width < 900, 82, 82)
                  X: =If(App.Width < 900, 330, 8)
                  Y: =If(App.Width < 900, 12, 340)
            - lblContactsTitle:
                Control: Label
                Properties:
                  Color: =cText
                  Font: =cFont
                  FontWeight: =FontWeight.Bold
                  Height: =36
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =26
                  Text: ="Contacts"
                  Width: =Parent.Width - If(App.Width < 900, 32, 150)
                  X: =If(App.Width < 900, 16, 124)
                  Y: =If(App.Width < 900, 68, 26)
            - lblContactsSubtitle:
                Control: Label
                Properties:
                  Color: =cMuted
                  Font: =cFont
                  Height: =22
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Text: ="People you sell to"
                  Width: =Parent.Width - If(App.Width < 900, 32, 150)
                  X: =If(App.Width < 900, 16, 124)
                  Y: =If(App.Width < 900, 102, 60)
            - txtContactsSearch:
                Control: Classic/TextInput
                Properties:
                  AccessibleLabel: ="Search contacts by name or company"
                  BorderColor: =cBorder
                  BorderThickness: =1
                  Color: =cText
                  Default: =varContactSearch
                  Fill: =cWhite
                  Font: =cFont
                  HintText: ="Search by name or company"
                  OnChange: =Set(varContactSearch, Lower(Trim(Self.Text)))
                  Width: =If(App.Width < 900, Parent.Width - 32, Parent.Width - 150)
                  X: =If(App.Width < 900, 16, 124)
                  Y: =If(App.Width < 900, 140, 96)
            - galContacts:
                Control: Gallery
                Variant: Vertical
                Properties:
                  AccessibleLabel: ="Contact cards"
                  Height: =Parent.Height - If(App.Width < 900, 206, 164)
                  Items: =Filter(colContacts, IsBlank(varContactSearch) || varContactSearch in Lower(Name & " " & Company))
                  TabIndex: =0
                  TemplatePadding: =6
                  TemplateSize: =If(App.Width < 900, 170, 178)
                  Width: =If(App.Width < 900, Parent.Width - 32, Parent.Width - 150)
                  WrapCount: =If(App.Width < 900, 1, 3)
                  X: =If(App.Width < 900, 16, 124)
                  Y: =If(App.Width < 900, 190, 148)
                Children:
                  - conContactCard:
                      Control: GroupContainer
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =cBorder
                        BorderThickness: =1
                        DropShadow: =DropShadow.Semilight
                        Fill: =cWhite
                        Height: =Parent.TemplateHeight - 8
                        RadiusBottomLeft: =14
                        RadiusBottomRight: =14
                        RadiusTopLeft: =14
                        RadiusTopRight: =14
                        Width: =Parent.TemplateWidth - 8
                        X: =2
                        Y: =2
                      Children:
                        - lblContactName:
                            Control: Label
                            Properties:
                              Color: =cText
                              Font: =cFont
                              FontWeight: =FontWeight.Semibold
                              Height: =24
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =15
                              Text: =ThisItem.Name
                              Width: =Parent.Width - 32
                              X: =16
                              Y: =13
                        - lblContactTitle:
                            Control: Label
                            Properties:
                              Color: =cMuted
                              Font: =cFont
                              Height: =20
                              Size: =12
                              Text: =ThisItem.Title
                              Width: =Parent.Width - 32
                              X: =16
                              Y: =39
                        - lblContactCompany:
                            Control: Label
                            Properties:
                              Color: =cText
                              Font: =cFont
                              FontWeight: =FontWeight.Semibold
                              Height: =20
                              Size: =12
                              Text: =ThisItem.Company
                              Width: =Parent.Width - 32
                              X: =16
                              Y: =66
                        - lblContactEmail:
                            Control: Label
                            Properties:
                              Color: =cMuted
                              Font: =cFont
                              Height: =19
                              Size: =11
                              Text: =ThisItem.Email
                              Width: =Parent.Width - 32
                              X: =16
                              Y: =91
                        - lblContactPhone:
                            Control: Label
                            Properties:
                              Color: =cMuted
                              Font: =cFont
                              Height: =19
                              Size: =11
                              Text: =ThisItem.Phone
                              Width: =Parent.Width - 32
                              X: =16
                              Y: =112
                        - lblContactLast:
                            Control: Label
                            Properties:
                              Color: =cBlue
                              Font: =cFont
                              Height: =19
                              Size: =11
                              Text: |-
                                ="Last contact: " & ThisItem.LastContact
                              Width: =Parent.Width - 32
                              X: =16
                              Y: =136
            - lblContactsEmpty:
                Control: Label
                Properties:
                  Align: =Align.Center
                  Color: =cMuted
                  Font: =cFont
                  Height: =36
                  Live: =Live.Polite
                  Size: =14
                  Text: ="No contacts match."
                  Visible: =galContacts.AllItemsCount = 0
                  Width: =Parent.Width - If(App.Width < 900, 32, 150)
                  X: =If(App.Width < 900, 16, 124)
                  Y: =210
