                  Width: =If(App.Width < 900, 82, 82)
                  X: =If(App.Width < 900, 330, 8)
                  Y: =If(App.Width < 900, 12, 340)
            - lblPipeTitle:
                Control: Label
                Properties:
                  Color: =cText
                  Font: =cFont
                  FontWeight: =FontWeight.Bold
                  Height: =36
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =26
                  Text: ="Deals pipeline"
                  Width: =Parent.Width - If(App.Width < 900, 32, 150)
                  X: =If(App.Width < 900, 16, 124)
                  Y: =If(App.Width < 900, 68, 26)
            - lblPipeSummary:
                Control: Label
                Properties:
                  Color: =cMuted
                  Font: =cFont
                  Height: =22
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Text: =CountRows(Filter(colDeals, Stage <> "Won")) & " open deals worth " & FmtINR(Sum(Filter(colDeals, Stage <> "Won"), Value)) & " · forecast " & FmtINR(Sum(Filter(colDeals, Stage <> "Won"), Value * Switch(Stage, "Qualified", 0.3, "Proposal", 0.5, "Negotiation", 0.75, 0)))
                  Width: =Parent.Width - If(App.Width < 900, 32, 150)
                  X: =If(App.Width < 900, 16, 124)
                  Y: =If(App.Width < 900, 104, 62)
