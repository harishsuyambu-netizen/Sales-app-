Screens:
  scrPipeline:
    Properties:
      Fill: =cCanvas
      OnVisible: =Set(varNavKey, 3)
    Children:
      - conPipeRoot:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =cCanvas
            Height: =Parent.Height
            Width: =Parent.Width
          Children:
            - shpPipeAccent:
                Control: Image
                Properties:
                  Height: =5
                  Image: =cAccentSvg
                  ImagePosition: =ImagePosition.Stretch
                  Width: =Parent.Width
            - shpPipeRail:
                Control: Rectangle
                Properties:
                  Fill: =cNavy
                  Height: =Parent.Height - 5
                  Visible: =App.Width >= 900
                  Width: =If(App.Width < 900, 0, 98)
                  Y: =5
            - shpPipeMobileNav:
                Control: Rectangle
                Properties:
                  Fill: =cNavy
                  Height: =56
                  Visible: =App.Width < 900
                  Width: =Parent.Width
                  Y: =5
            - imgPipeLogo:
                Control: Image
                Properties:
                  AccessibleLabel: ="CRM logo"
                  Height: =54
                  Image: =cLogoSvg
                  ImagePosition: =ImagePosition.Fit
                  Width: =54
                  X: =If(App.Width < 900, 12, 20)
                  Y: =If(App.Width < 900, 12, 22)
            - galPipeMobileNav:
                Control: Gallery
                Variant: Horizontal
                Properties:
                  AccessibleLabel: ="Main navigation"
                  Height: =46
                  Items: =Table({Key:1, Caption:"Dashboard"}, {Key:2, Caption:"Leads"}, {Key:3, Caption:"Pipeline"}, {Key:4, Caption:"Contacts"}, {Key:5, Caption:"Activities"})
                  Selectable: =false
                  ShowScrollbar: =false
                  TabIndex: =0
                  TemplatePadding: =2
                  TemplateSize: =84
                  Visible: =App.Width < 900
                  Width: =Parent.Width - 70
                  X: =66
                  Y: =10
                Children:
                  - btnPipeMobileNavItem:
                      Control: Classic/Button
                      Properties:
                        BorderThickness: =0
                        Color: =If(varNavKey = ThisItem.Key, cBlue, cWhite)
                        Fill: =If(varNavKey = ThisItem.Key, cWhite, cNavy)
                        Font: =cFont
                        OnSelect: =Set(varNavKey, ThisItem.Key); Switch(ThisItem.Key, 1, Navigate(Screen1, ScreenTransition.None), 2, Navigate(scrLeads, ScreenTransition.None), 3, Navigate(scrPipeline, ScreenTransition.None), 4, Navigate(scrContacts, ScreenTransition.None), 5, Navigate(scrActivities, ScreenTransition.None))
                        RadiusBottomLeft: =14
                        RadiusBottomRight: =14
                        RadiusTopLeft: =14
                        RadiusTopRight: =14
                        Size: =10
                        Text: =ThisItem.Caption
                        Width: =Parent.TemplateWidth - 4
                        Y: =2
            - btnPipeNavDash:
                Control: Classic/Button
                Properties:
                  BorderThickness: =0
                  Color: =cWhite
                  Fill: =cNavy
                  Font: =cFont
                  Height: =If(App.Width < 900, 42, 56)
                  OnSelect: =Navigate(Screen1, ScreenTransition.None)
                  RadiusBottomLeft: =14
                  RadiusBottomRight: =14
                  RadiusTopLeft: =14
                  RadiusTopRight: =14
                  Size: =If(App.Width < 900, 10, 11)
                  Text: ="Dashboard"
                  Visible: =App.Width >= 900
                  Width: =If(App.Width < 900, 80, 82)
                  X: =If(App.Width < 900, 12, 8)
                  Y: =If(App.Width < 900, 12, 92)
            - btnPipeNavLeads:
                Control: Classic/Button
                Properties:
                  BorderThickness: =0
                  Color: =cWhite
                  Fill: =cNavy
                  Font: =cFont
                  Height: =If(App.Width < 900, 42, 56)
                  OnSelect: =Navigate(scrLeads, ScreenTransition.None)
                  RadiusBottomLeft: =14
                  RadiusBottomRight: =14
                  RadiusTopLeft: =14
                  RadiusTopRight: =14
                  Size: =If(App.Width < 900, 10, 11)
                  Text: ="Leads"
                  Visible: =App.Width >= 900
                  Width: =If(App.Width < 900, 70, 82)
                  X: =If(App.Width < 900, 96, 8)
                  Y: =If(App.Width < 900, 12, 154)
            - btnPipeNavPipe:
